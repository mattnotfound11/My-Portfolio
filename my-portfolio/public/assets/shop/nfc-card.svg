<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Two blank white NFC cards">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f2f4"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e6ea"/>
      <stop offset="1" stop-color="#cfd2d8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a1d24" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#ffffff"/>
  <!-- back card, standing portrait -->
  <g transform="translate(240 150)" filter="url(#soft)">
    <rect x="6" y="10" width="360" height="560" rx="26" fill="url(#edge)"/>
    <rect width="360" height="560" rx="26" fill="url(#face)" stroke="#e3e5e9" stroke-width="2"/>
  </g>
  <!-- front card, tilted landscape -->
  <g transform="translate(330 360) rotate(-28 270 175)" filter="url(#soft)">
    <rect x="-8" y="14" width="560" height="356" rx="26" fill="url(#edge)"/>
    <rect width="560" height="356" rx="26" fill="url(#face)" stroke="#e3e5e9" stroke-width="2"/>
    <rect x="18" y="18" width="524" height="320" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
  </g>
</svg>
